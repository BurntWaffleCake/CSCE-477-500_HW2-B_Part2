<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Juice Shop Clone</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 360px;
      margin: 80px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    h1 {
      font-size: 20px;
      text-align: center;
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      background: #ff8300;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
    }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm" novalidate>
    <label for="email">Email</label>
    <input type="text" id="email" name="email" autocomplete="off">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="off">

    <button type="submit">Log in</button>
    <div id="message"></div>
  </form>

  <script src="app.js"></script>
</body>
</html>
